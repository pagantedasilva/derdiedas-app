schema: paperclip/v1
# Model tiers, to control token cost. Edit `type` and `model` for the runtime you actually use.
# Valid types: claude_local, codex_local, opencode_local, pi_local, cursor, gemini_local, openclaw_gateway
#
# Strong tier (mistakes are expensive): ceo, ios-developer, android-developer, german-content-editor
# Standard tier (judgment and writing):  ux-designer, ux-copy-expert
# Economy tier (routine work, drafts):   devops-engineer, qa-tester, marketing-manager, support-specialist
# Verify the economy model ID is accepted by your adapter before importing.
agents:
  ceo:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  ios-developer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  android-developer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  german-content-editor:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  ux-designer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  ux-copy-expert:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  devops-engineer:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-5-5
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
  qa-tester:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-5-5
  marketing-manager:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-5-5
  support-specialist:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-5-5
